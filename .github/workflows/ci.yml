name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Linux build, tests and a headless run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2, OpenGL ES and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libsdl2-dev libgles-dev libegl-dev libegl-mesa0
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Drive for 150 frames without a display (Mesa software OpenGL ES)
        env:
          SDL_VIDEODRIVER: offscreen
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: ./build/amherst-run --frames 150 --screenshot frame.bmp
      - name: Keep the frame
        uses: actions/upload-artifact@v4
        with:
          name: frame
          path: frame.bmp
