name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Linux build, tests and a headless run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SDL2, OpenGL ES and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libsdl2-dev libgles-dev libegl-dev libegl-mesa0
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Get the baked map named in MAP_VERSION (until an amherst-run release includes it, map steps skip)
        id: map
        run: |
          if python3 tools/fetch_map.py; then echo "have=yes" >> "$GITHUB_OUTPUT"; else echo "have=no" >> "$GITHUB_OUTPUT"; fi
      - name: Tests (the map parity test is skipped without the map)
        run: ctest --test-dir build --output-on-failure
      - name: Drive for 150 frames without a display (Mesa software OpenGL ES)
        if: steps.map.outputs.have == 'yes'
        env:
          SDL_VIDEODRIVER: offscreen
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: ./build/amherst-run --frames 150 --screenshot frame.bmp
      - name: Keep the frame
        if: steps.map.outputs.have == 'yes'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frame
          path: frame.bmp

  android:
    name: Android APK (SDL2 from source, NDK, Gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SDL_VERSION: "2.32.10"
      SDL_SHA256: "5f5993c530f084535c65a6879e9b26ad441169b3e25d789d83287040a9ca5165"
      GRADLE_VERSION: "8.7"
      GRADLE_SHA256: "544c35d6bd849ae8a5ed0bcea39ba677dc40f49df7d1835561582da2009b961d"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The baked map, into the APK's assets
        run: |
          python3 tools/fetch_map.py
          mkdir -p platform/android/app/assets
          cp assets/amherst.amr platform/android/app/assets/
      - name: SDL2 source (checked against its SHA-256)
        run: |
          curl -sSL -o sdl.tar.gz "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-${SDL_VERSION}.tar.gz"
          echo "${SDL_SHA256}  sdl.tar.gz" | sha256sum -c -
          tar xzf sdl.tar.gz
          mv "SDL2-${SDL_VERSION}" platform/android/SDL2
      - name: Gradle (checked against its SHA-256)
        run: |
          curl -sSL -o gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          echo "${GRADLE_SHA256}  gradle.zip" | sha256sum -c -
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
      - name: What the runner has (Java, Android SDK, NDK, CMake)
        run: |
          java -version 2>&1 | head -1
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk" || true
          ls "$ANDROID_HOME/cmake" || true
      - name: Build the APK (with the runner's Java 17, which the Android build tools want)
        working-directory: platform/android
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          NDK=$(basename "$ANDROID_NDK_LATEST_HOME")
          CMAKE=$(ls "$ANDROID_HOME/cmake" | sort -V | tail -1)
          echo "NDK $NDK, CMake $CMAKE"
          gradle --no-daemon assembleDebug -PndkVersion="$NDK" -PcmakeVersion="$CMAKE"
      - name: Keep the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: amherst-run-android-debug
          path: platform/android/app/build/outputs/apk/debug/*.apk

  xbox:
    name: Xbox One / Windows package (UWP, SDL2 + ANGLE), signed with a test certificate
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      SDL_VERSION: "2.32.10"
      SDL_SHA256: "5f5993c530f084535c65a6879e9b26ad441169b3e25d789d83287040a9ca5165"
      ANGLE_VERSION: "2.1.14"
      ANGLE_SHA256: "566f78d4fab2086e694dc8f1edcdb498ee549dade8a198ca95246cfdd0632e98"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The baked map
        run: python tools/fetch_map.py
      - name: SDL2 source and ANGLE.WindowsStore (both checked against their SHA-256)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/libsdl-org/SDL/releases/download/release-$env:SDL_VERSION/SDL2-$env:SDL_VERSION.tar.gz" -OutFile sdl.tar.gz
          $h = (Get-FileHash sdl.tar.gz -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:SDL_SHA256) { throw "SDL2 checksum $h does not match" }
          tar xzf sdl.tar.gz
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/angle.windowsstore/$env:ANGLE_VERSION/angle.windowsstore.$env:ANGLE_VERSION.nupkg" -OutFile angle.zip
          $h = (Get-FileHash angle.zip -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:ANGLE_SHA256) { throw "ANGLE checksum $h does not match" }
          Expand-Archive angle.zip -DestinationPath angle
      - name: Build SDL2 for UWP (x64)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          & $msbuild "SDL2-$env:SDL_VERSION\VisualC-WinRT\SDL-UWP.vcxproj" /p:Configuration=Release /p:Platform=x64 /m /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "SDL2 UWP build failed ($LASTEXITCODE)" }
      - name: A test signing certificate (made fresh for this build; its subject matches the manifest's Publisher)
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=AmherstRunDev" -KeyUsage DigitalSignature `
            -FriendlyName "Amherst Run test signing" -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pw = ConvertTo-SecureString -String "amherst-run-test" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$env:RUNNER_TEMP\amherst-run-test.pfx" -Password $pw | Out-Null
          Export-Certificate -Cert $cert -FilePath "$env:RUNNER_TEMP\amherst-run-test.cer" | Out-Null
      - name: Configure and build the package
        shell: pwsh
        run: |
          $root = (Get-Location).Path -replace '\\', '/'
          $sdl = "$root/SDL2-$env:SDL_VERSION"
          cmake -S platform/uwp -B build-uwp -G "Visual Studio 17 2022" -A x64 `
            "-DCMAKE_SYSTEM_NAME=WindowsStore" "-DCMAKE_SYSTEM_VERSION=10.0" `
            "-DSDL_DIR=$sdl" "-DSDL_LIB_DIR=$sdl/VisualC-WinRT/x64/Release/SDL-UWP" `
            "-DANGLE_DIR=$root/angle" "-DMAP_FILE=$root/assets/amherst.amr" "-DAMR_VERSION=0.1.${{ github.run_number }}-xbox" `
            "-DAMR_PKG_VERSION=0.1.${{ github.run_number }}.0"
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          & $msbuild build-uwp\AmherstRun.vcxproj /p:Configuration=Release /p:Platform=x64 /m /v:minimal `
            /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly /p:GenerateAppxPackageOnBuild=true `
            /p:AppxPackageDir="$root\AppPackages\" /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile="$env:RUNNER_TEMP\amherst-run-test.pfx" /p:PackageCertificatePassword=amherst-run-test
          if ($LASTEXITCODE -ne 0) { throw "package build failed ($LASTEXITCODE)" }
          Copy-Item "$env:RUNNER_TEMP\amherst-run-test.cer" AppPackages\
          Copy-Item platform\uwp\INSTALL.txt AppPackages\
          Get-ChildItem -Recurse AppPackages | Select-Object FullName, Length
      - name: Keep the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: amherst-run-xbox-uwp
          path: AppPackages/
